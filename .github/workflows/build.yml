name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish UI
        run: dotnet publish src/MpyjVPN.Avalonia -c Release -r win-x64 --self-contained true -o dist/publish-normal

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MpyjVPN-Windows-x64
          path: dist/publish-normal/
          retention-days: 30

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libice6 libsm6 libfontconfig1

      - name: Publish UI
        run: dotnet publish src/MpyjVPN.Avalonia -c Release -r linux-x64 --self-contained true -o dist/publish-linux

      - name: Make executable
        run: chmod +x dist/publish-linux/MpyjVPN.Avalonia

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MpyjVPN-Linux-x64
          path: dist/publish-linux/
          retention-days: 30

  build-macos:
    name: Build macOS (x64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish UI
        run: dotnet publish src/MpyjVPN.Avalonia -c Release -r osx-x64 --self-contained true -o dist/publish-macos

      - name: Make executable
        run: chmod +x dist/publish-macos/MpyjVPN.Avalonia

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MpyjVPN-macOS-x64
          path: dist/publish-macos/
          retention-days: 30