name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release-windows:
    name: Release Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish UI
        run: dotnet publish src/MpyjVPN.Avalonia -c Release -r win-x64 --self-contained true -o dist/publish-normal

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: cmd

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\setup.iss
        shell: pwsh

      - name: Rename Installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $installer = Get-ChildItem "dist/MpyjVPN-Setup-*.exe" | Select-Object -First 1
          if ($installer) {
            Move-Item $installer.FullName "dist/MpyjVPN-v$version-Windows-Setup.exe" -Force
          }

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Compress-Archive -Path "dist/publish-normal/*" -DestinationPath "dist/MpyjVPN-v$version-Windows-Portable.zip" -Force

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MpyjVPN-*-Windows-Setup.exe
            dist/MpyjVPN-*-Windows-Portable.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-linux-x64:
    name: Release Linux (x64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libice6 libsm6 libfontconfig1

      - name: Publish UI
        run: dotnet publish src/MpyjVPN.Avalonia -c Release -r linux-x64 --self-contained true -o dist/publish-linux-x64

      - name: Create Tarball
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          chmod +x dist/publish-linux-x64/MpyjVPN.Avalonia
          cd dist/publish-linux-x64
          tar -czvf "../MpyjVPN-v${version}-Linux-x64.tar.gz" *
          cd ../..

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MpyjVPN-*-Linux-x64.tar.gz
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-linux-arm64:
    name: Release Linux (ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libice6 libsm6 libfontconfig1

      - name: Publish UI
        run: dotnet publish src/MpyjVPN.Avalonia -c Release -r linux-arm64 --self-contained true -o dist/publish-linux-arm64

      - name: Create Tarball
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          chmod +x dist/publish-linux-arm64/MpyjVPN.Avalonia
          cd dist/publish-linux-arm64
          tar -czvf "../MpyjVPN-v${version}-Linux-ARM64.tar.gz" *
          cd ../..

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MpyjVPN-*-Linux-ARM64.tar.gz
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-macos-x64:
    name: Release macOS (Intel)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish UI
        run: dotnet publish src/MpyjVPN.Avalonia -c Release -r osx-x64 --self-contained true -o dist/publish-macos-x64

      - name: Create Tarball
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          chmod +x dist/publish-macos-x64/MpyjVPN.Avalonia
          cd dist/publish-macos-x64
          tar -czvf "../MpyjVPN-v${version}-macOS-x64.tar.gz" *
          cd ../..

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MpyjVPN-*-macOS-x64.tar.gz
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-macos-arm64:
    name: Release macOS (Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish UI
        run: dotnet publish src/MpyjVPN.Avalonia -c Release -r osx-arm64 --self-contained true -o dist/publish-macos-arm64

      - name: Create Tarball
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          chmod +x dist/publish-macos-arm64/MpyjVPN.Avalonia
          cd dist/publish-macos-arm64
          tar -czvf "../MpyjVPN-v${version}-macOS-ARM64.tar.gz" *
          cd ../..

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MpyjVPN-*-macOS-ARM64.tar.gz
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}